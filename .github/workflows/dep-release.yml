name: Dependency release

# Turns merged Dependabot bumps into a released version: finalize CHANGELOG.md,
# tag, and hand the tag to the Release workflow, which builds and publishes as
# it does for any other tag.
#
# Dispatched by dependabot-auto-merge.yml after a merge that touched the app,
# and runnable by hand ("Run workflow" on master) to release whatever bumps are
# sitting on master. It stops without doing anything when there are none.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write # the CHANGELOG lands through a pull request, see below
  actions: write # to dispatch release.yml

# Two merges landing at once must not race into two half-releases.
concurrency:
  group: dep-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Amsterdam # the date in the CHANGELOG heading is local, not UTC
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # The token is chosen HERE, not at the push: checkout persists an
      # `http.https://github.com/.extraheader` credential and that header wins
      # over any token handed to a later `git push`, so a PAT supplied at push
      # time is silently ignored (v1.5.2 was pushed that way, authenticated as
      # GITHUB_TOKEN, and therefore started nothing). With RELEASE_PAT the tag
      # push carries a real identity and release.yml runs from its push trigger;
      # without it the push starts nothing and the build must be dispatched —
      # which then cannot create the release.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0 # tags and history: the script reads both
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - name: Prepare the version and CHANGELOG
        id: prep
        run: python3 .github/scripts/prepare-dep-release.py

      # master requires that changes arrive through a pull request. With
      # RELEASE_PAT the push carries the maintainer's identity, and the maintainer
      # may bypass that rule (enforce_admins is off), so the commit goes straight
      # to master. The pull request is the fallback for the GITHUB_TOKEN path:
      # the bot is no admin, but it may open and merge its own pull request
      # (0 reviews required). Either way the tag points at the CHANGELOG commit.
      #
      # Why not always the pull request: one opened with GITHUB_TOKEN gets CI and
      # CodeQL runs that never receive a job, because events from GITHUB_TOKEN
      # start no workflows. When the pull request closes they fail with "workflow
      # file issue", which mailed two failures per release from v1.5.19 to
      # v1.5.24. Waiting for the pull request's checks first changed nothing.
      - name: Commit the CHANGELOG
        if: steps.prep.outputs.release == 'true'
        env:
          TAG: ${{ steps.prep.outputs.version }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          # A re-run can find the section already on master (the previous attempt
          # merged it and failed later); there is then nothing to commit, and
          # `git commit` would abort the whole step.
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG already carries the section for $TAG — going straight to the tag."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "CHANGELOG: finalize $TAG (dependency updates)" CHANGELOG.md
          # Authentication comes from the checkout step, so with RELEASE_PAT set
          # this push is the maintainer's.
          if [ -n "${RELEASE_PAT:-}" ]; then
            if git push origin HEAD:master; then
              echo "CHANGELOG for $TAG pushed to master."
              exit 0
            fi
            echo "::warning::Pushing the CHANGELOG to master was refused, so it goes through a pull request; its CI and CodeQL runs will fail with 'workflow file issue'."
          fi
          branch="chore/changelog-$TAG"
          git checkout -b "$branch"
          # Force and reuse, so a re-run after a failed attempt picks up where it
          # left off instead of tripping over its own leftovers: the branch and
          # the pull request may both already exist from the previous try.
          git push --force origin "$branch"
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo "Reusing the open pull request for $branch."
          else
            gh pr create --base master --head "$branch" \
              --title "CHANGELOG: finalize $TAG (dependency updates)" \
              --body "Opened by the Dependency release workflow: the CHANGELOG section for \`$TAG\`, which is tagged as soon as this lands."
          fi
          # Let the checks that do run on the branch finish before merging, so a
          # genuinely failing check stops the release here. Those are the push runs
          # when the branch was pushed with RELEASE_PAT; with GITHUB_TOKEN there are
          # none, and the loop below gives up after 3 min.
          # `gh pr checks` exits 0 when all passed, 8 while pending, and 1 both on a
          # failure and while no checks are reported yet; wait up to 3 min for them.
          checks=none
          for attempt in $(seq 1 18); do
            rc=0
            out=$(gh pr checks "$branch" 2>&1) || rc=$?
            if [ "$rc" = 0 ] || [ "$rc" = 8 ]; then checks=present; break; fi
            if [ "$rc" = 1 ] && ! grep -qi "no checks reported" <<<"$out"; then checks=present; break; fi
            sleep 10
          done
          if [ "$checks" = present ]; then
            gh pr checks "$branch" --watch --fail-fast --interval 20
          else
            echo "No checks reported on $branch after 3 min — merging without waiting."
          fi
          # A freshly opened pull request reports its mergeability asynchronously,
          # so the first attempt can legitimately come back "not mergeable".
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$branch" --squash --delete-branch; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::Could not merge $branch after 5 attempts."
              exit 1
            fi
            sleep 10
          done

      # Two ways to get the tag onto the remote, and the difference decides
      # whether the release publishes itself:
      #
      # * With RELEASE_PAT the push carries a real identity, so it fires the push
      #   trigger on release.yml like a hand-pushed tag always has.
      # * With GITHUB_TOKEN the push starts nothing (Actions does not trigger
      #   itself), so release.yml has to be dispatched — and a dispatched run is
      #   refused when it tries to CREATE the GitHub release ("Resource not
      #   accessible by integration"), while uploading assets to an existing one
      #   is allowed. Proven on 2026-08-17: v1.5.0 (tag push) published itself,
      #   v1.5.1 (dispatch) built fine and then could not create its release.
      - name: Tag the release
        id: tag
        if: steps.prep.outputs.release == 'true'
        env:
          TAG: ${{ steps.prep.outputs.version }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          git fetch origin master
          git tag -f "$TAG" origin/master
          # Authentication comes from the checkout step above, so this one push
          # covers both cases; only what happens next differs.
          git push -f origin "$TAG"
          if [ -n "${RELEASE_PAT:-}" ]; then
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            echo "Tag pushed as a real identity — release.yml runs from the push."
          else
            echo "dispatch=true" >> "$GITHUB_OUTPUT"
            echo "::warning::RELEASE_PAT is not set (or expired), so release.yml is dispatched instead and cannot create the release for $TAG. Run 'gh release create $TAG --notes-file <the CHANGELOG section>' and re-run release.yml on that tag, or set the secret."
          fi

      # Only needed on the GITHUB_TOKEN path: that push started nothing, so the
      # build has to be asked for. workflow_dispatch is the documented exception
      # to "events from GITHUB_TOKEN do not trigger workflows". release.yml reads
      # the version from github.ref_name either way.
      - name: Build and publish the release
        if: steps.prep.outputs.release == 'true' && steps.tag.outputs.dispatch == 'true'
        env:
          TAG: ${{ steps.prep.outputs.version }}
        run: gh workflow run release.yml --ref "$TAG"

      - name: Nothing to release
        if: steps.prep.outputs.release != 'true'
        run: echo "::notice::No unreleased dependency commits on master."
